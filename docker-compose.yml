# Local evaluation, not production.
#
# The defaults below exist so `docker compose up --build` works on a laptop
# with no setup at all: a known database password, a placeholder AUTH_SECRET
# and email/password sign-in switched on. A real deployment supplies its own
# secrets, turns AUTH_ALLOW_PASSWORD off and signs in through Microsoft - see
# README.md, "Signing in with Microsoft".

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: hoshin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hoshin}
      POSTGRES_DB: hoshin
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hoshin -d hoshin"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://hoshin:${POSTGRES_PASSWORD:-hoshin}@db:5432/hoshin?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-production}
      AUTH_TRUST_HOST: "true"
      NODE_ENV: production
      # NODE_ENV=production is what the built image expects, and it also turns
      # password sign-in off. Without this line the first thing a new user
      # meets is a sign-in screen they cannot get past: the only button is
      # Microsoft, and Microsoft is not configured yet. Set it to false once
      # Entra is wired up.
      AUTH_ALLOW_PASSWORD: "${AUTH_ALLOW_PASSWORD:-true}"
    ports:
      - "3000:3000"

volumes:
  db-data:
